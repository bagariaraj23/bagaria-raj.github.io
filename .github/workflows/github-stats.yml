name: Update GitHub stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Count public projects and source lines
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: bagariaraj23
        run: python3 scripts/fetch-github-stats.py

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-stats.json
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "Update GitHub profile stats [skip ci]"
          git push
